[project]
name = "disco_shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["disco_shared*"]
