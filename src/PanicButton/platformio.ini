; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Machine-specific overrides (which COM port the board is on, etc.) live in a
; gitignored platformio.local.ini - see README "Serial monitor". A missing file
; is fine; extra_configs is glob-matched and silently skips it.
extra_configs = platformio.local.ini

[env:seeed_xiao_esp32c6]
; The official PlatformIO espressif32 platform only ships Arduino-ESP32 core 2.x,
; which has no ESP32-C6 support. The pioarduino fork tracks Arduino-ESP32 3.x,
; which is what the Arduino IDE board package for the XIAO ESP32C6 uses too.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
; 3 MB app partition instead of the default 2 x 1.25 MB OTA slots: we flash over
; USB, not OTA, and HTTPClient + the Wi-Fi stack already fill ~85% of the default.
board_build.partitions = huge_app.csv
monitor_speed = 115200
; Decode backtraces from crash dumps in the monitor output using firmware.elf.
monitor_filters = esp32_exception_decoder
