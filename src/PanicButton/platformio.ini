; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio.local.ini
default_envs = seeed_xiao_esp32c6_debug

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = bitbank2/OneBitDisplay@^3.0.0
; Pin the Library Dependency Finder to its default. When this is left unset,
; PlatformIO silently switches any library whose manifest has a `depends`
; line (OneBitDisplay -> BitBang_I2C) to the preprocessor-evaluating chain+
; mode, which misjudges the `#if defined(ARDUINO)` guard around OneBitDisplay's
; `#include <BitBang_I2C.h>` and drops it, so BitBang_I2C never lands on the
; include path and the build fails with "BitBang_I2C.h: No such file".
lib_ldf_mode = chain

[env:seeed_xiao_esp32c6_debug]
extends = env:seeed_xiao_esp32c6
build_flags = -DDEBUG_SERIAL
