[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disco_server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "disco_shared",
    "flask",
    "python-vlc",
    "pydantic",
    "flasgger",
    "SQLAlchemy",
]

[project.optional-dependencies]
dev = ["pytest"]
deploy = ["waitress"]

[tool.uv.sources]
disco_shared = { path = "../disco_shared", editable = true }

[tool.uv]
config-settings = { editable_mode = "compat" }

[tool.setuptools.packages.find]
where = ["."]
include = ["disco_server*"]
