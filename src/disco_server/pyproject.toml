[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disco_server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "disco_core",
    "flask",
    "python-vlc",
    "pydantic",
    "flasgger",
    "SQLAlchemy",
]

[tool.uv.sources]
disco_core = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["disco_server*"]
