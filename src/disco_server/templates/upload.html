<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Panic Disco</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
</head>
<body class="bg-gray-50 text-gray-900">
  <main class="mx-auto max-w-7xl px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-semibold">Upload track</h1>
      <a href="{{ url_for('web.index') }}" class="text-sm text-indigo-600 hover:text-indigo-700">
        Back to tracks
      </a>
    </div>

    <form id="upload-form"
          class="max-w-xl mx-auto space-y-6"
          data-upload-url="{{ url_for('tracks.upload_track') }}">

      <div id="drop-zone"
           class="border-2 border-dashed border-gray-300 rounded p-8 text-center cursor-pointer">
        <p id="drop-zone-text" class="text-gray-500">
          Drag an audio file here, or click to browse
        </p>
        <input type="file" id="file-input" accept=".mp3,.wav,.flac,audio/*" class="hidden">
      </div>

      <div>
        <label for="name-input" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
        <input type="text" id="name-input" name="name" required
               class="w-full rounded border border-gray-300 px-3 py-2">
      </div>

      <div>
        <audio id="preview-player" controls class="w-full mt-2 hidden"></audio>
        <div class="mt-2 flex items-center gap-3">
          <button type="button" id="mark-cue-btn" disabled
                  class="rounded bg-indigo-600 px-3 py-1 text-sm text-white hover:bg-indigo-700 disabled:bg-gray-300">
            Mark cue point here
          </button>
          <label for="cue-point-input" class="text-sm text-gray-700">Cue point (seconds):</label>
          <input type="number" id="cue-point-input" name="cue_point" min="0" step="1"
                 class="w-20 rounded border border-gray-300 px-2 py-1 text-sm">
          <span class="text-sm text-gray-500">(<span id="cue-display">not set</span>)</span>
        </div>
        <p class="mt-1 text-sm text-gray-500">
          Play the track and click "Mark cue point here", or fine-tune the seconds directly.
        </p>
      </div>

      <div id="upload-error" class="hidden rounded bg-red-50 px-3 py-2 text-sm text-red-600" role="alert"></div>

      <button type="submit" id="submit-btn" disabled
              class="rounded bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700 disabled:bg-gray-300">
        Upload
      </button>
    </form>
  </main>
  <script src="{{ url_for('static', filename='js/upload.js') }}" defer></script>
</body>
</html>
