<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Panic Disco</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
</head>
<body class="bg-gray-50 text-gray-900">
  <main class="mx-auto max-w-7xl px-4 py-8">
    <h1 class="text-2xl font-semibold mb-6">Tracks</h1>

    {% if tracks %}
    <table class="w-full text-left border-collapse divide-y divide-gray-200">
      <thead>
        <tr>
          <th class="px-4 py-2 font-medium text-gray-500">Name</th>
          <th class="px-4 py-2 font-medium text-gray-500">Cue point</th>
          <th class="px-4 py-2 font-medium text-gray-500">Preview</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        {% for track in tracks %}
        <tr>
          <td class="px-4 py-2">{{ track.name }}</td>
          <td class="px-4 py-2">{{ track.cue_time | cue_point }}</td>
          <td class="px-4 py-2">
            <button type="button"
                    class="preview-toggle rounded bg-indigo-600 px-3 py-1 text-sm text-white hover:bg-indigo-700"
                    data-src="{{ url_for('tracks.get_track_file', track_id=track.id) }}"
                    aria-pressed="false">
              Play
            </button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p class="text-gray-500">No tracks yet.</p>
    {% endif %}
  </main>
  <script src="{{ url_for('static', filename='js/tracks.js') }}" defer></script>
</body>
</html>
